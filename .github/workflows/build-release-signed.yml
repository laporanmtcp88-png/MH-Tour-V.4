name: Build MH Tour APK

on: workflow_dispatch

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Check Android project
        working-directory: android
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          echo "Android project OK"

      - name: Build Debug APK
        working-directory: android
        run: gradle --no-daemon clean assembleDebug

      - name: Prepare APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MH_Tour_Debug.apk
          ls -lh MH_Tour_Debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MH-Tour-APK
          path: MH_Tour_Debug.apk
          retention-days: 30
